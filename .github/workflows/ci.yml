name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin

jobs:
  gradle:
    name: Gradle build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxrender1 libxi6 libxrandr2

      - name: Build and test
        env:
          FIREBASE_WEB_API_KEY: test-api-key
          FIREBASE_PROJECT_ID: mira-test
          MIRA_GOOGLE_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
        run: xvfb-run -a ./gradlew build --no-daemon -Proborazzi.test.verify=true

  wasm:
    name: Web (wasm) build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build wasm distribution
        env:
          FIREBASE_WEB_API_KEY: test-api-key
          FIREBASE_PROJECT_ID: mira-test
          MIRA_GOOGLE_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon


  ios:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS framework
        env:
          FIREBASE_WEB_API_KEY: test-api-key
          FIREBASE_PROJECT_ID: mira-test
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon
      - name: Build iOS app (simulator)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
